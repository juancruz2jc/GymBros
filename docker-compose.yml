services:
  db:
    image: postgres:16-alpine
    # Las credenciales (POSTGRES_USER/PASSWORD/DB) salen del .env, no de aquí.
    # El contenedor recibe también las demás variables del archivo; PostgreSQL
    # ignora las que no conoce.
    env_file: ./gymbros-api/.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./gymbros-api
    env_file: ./gymbros-api/.env
    ports:
      - "8001:8000"
    volumes:
      - ./gymbros-api:/code
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
