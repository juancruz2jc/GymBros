# Puertos y nombre del proyecto salen del .env de la raíz (ver .env.example),
# así un entorno nuevo (VPS, producción) solo cambia variables, no este archivo.
services:
  # La base de datos es la compartida del equipo en Supabase (DATABASE_URL en
  # gymbros-api/.env). Aquí solo corre la API.
  api:
    build: ./gymbros-api
    restart: unless-stopped
    env_file: ./gymbros-api/.env
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8000"
    volumes:
      - ./gymbros-api:/code

  # Página "en construcción" en la raíz del dominio. HTML estático: se edita
  # landing/index.html y se ve al recargar, sin reconstruir nada.
  landing:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LANDING_PORT:-8002}:80"
    volumes:
      - ./landing:/usr/share/nginx/html:ro
