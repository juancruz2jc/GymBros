# Configuración de pytest. Se ejecuta desde gymbros-api/:  pytest
# Guía completa: README.md, sección "Pruebas automatizadas".
[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
markers =
    unit: lógica pura (seguridad, esquemas, cálculos); no usa HTTP.
    api: prueba un endpoint de punta a punta (HTTP + base de datos de pruebas).
